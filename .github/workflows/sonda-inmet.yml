name: Sonda INMET

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/sonda-inmet.yml"

jobs:
  sondar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cabeçalhos do arquivo de 2026
        run: curl --head --fail --silent --show-error --max-time 60 https://portal.inmet.gov.br/uploads/dadoshistoricos/2026.zip
      - name: Cabeçalhos do arquivo de 2025
        run: curl --head --fail --silent --show-error --max-time 60 https://portal.inmet.gov.br/uploads/dadoshistoricos/2025.zipgit 